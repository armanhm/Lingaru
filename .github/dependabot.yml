version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      django:
        patterns: ["Django*", "django-*", "djangorestframework*"]
      llm:
        patterns: ["google-genai", "groq", "sentry-sdk*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      react:
        patterns: ["react", "react-dom", "react-router*", "@types/react*"]
      sentry:
        patterns: ["@sentry/*"]
      eslint:
        patterns: ["eslint*", "@eslint/*"]
    ignore:
      # eslint-plugin-react 7.x supports ESLint <= 9; revisit when it adds ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    ignore:
      # Python runtime upgrades are planned changes (CI tests run on 3.12);
      # keep receiving patch-level image updates only.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
