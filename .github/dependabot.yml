version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      django:
        patterns: ["Django*", "django-*", "djangorestframework*"]
      llm:
        patterns: ["google-genai", "groq", "sentry-sdk*"]
      # Everything else: one PR for all minor and patch updates, so a week
      # of updates costs one CI run instead of one per package. Majors
      # still arrive as their own PRs.
      backend-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      react:
        patterns: ["react", "react-dom", "react-router*", "@types/react*"]
      sentry:
        patterns: ["@sentry/*"]
      eslint:
        patterns: ["eslint*", "@eslint/*"]
      # The compiler and its Vite plugin must stay on the same version.
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      # Everything else: one PR for all minor and patch updates (see above).
      frontend-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # eslint-plugin-react 7.x supports ESLint <= 9; revisit when it adds ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # The Playwright version must match the visual-regression container image;
      # bump both together in one PR.
      - dependency-name: "@playwright/test"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    ignore:
      # Python runtime upgrades are planned changes (CI tests run on 3.12);
      # keep receiving patch-level image updates only.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
