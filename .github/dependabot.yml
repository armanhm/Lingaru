version: 2

# One combined pull request per week for every ecosystem below.
# Dependabot checks on Monday and puts all version updates (backend,
# frontend, GitHub Actions, Docker base image) into a single PR.
# Security updates are separate from this schedule and can still
# arrive at any time.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
    labels: [dependencies]

updates:
  - package-ecosystem: pip
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: npm
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      # eslint-plugin-react 7.x supports ESLint <= 9; revisit when it adds ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # The Playwright version must match the visual-regression container image;
      # bump both together in one PR.
      - dependency-name: "@playwright/test"

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: docker
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      # Python runtime upgrades are planned changes (CI tests run on 3.12);
      # keep receiving patch-level image updates only.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
