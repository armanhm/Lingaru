services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-lingaru}
      POSTGRES_USER: ${DB_USER:-lingaru}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lingaru}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lingaru}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    restart: unless-stopped
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations are NOT run at container start: the deploy runs them once
    # as a one-off (docker compose run --rm django python manage.py migrate)
    # before app containers are swapped. On a fresh host run that by hand.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  celery:
    restart: unless-stopped
    build: *backend-build
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info

  celery-beat:
    restart: unless-stopped
    build: *backend-build
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info

  bot:
    restart: unless-stopped
    build: *backend-build
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py run_bot

  nginx:
    restart: unless-stopped
    build:
      # Build from the repo root so the Dockerfile can copy ./frontend
      # in for the multi-stage build.
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      # Host port can be overridden via LINGARU_HTTP_PORT in .env
      # (useful when 80 is already taken by another service like HAProxy)
      - "${LINGARU_HTTP_PORT:-80}:80"
    volumes:
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - django

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
